# Changes are pushed straight to main (AGENTS.md, "Landing changes"). A push to
# main runs the checks, deploys staging, checks that staging answers, then does
# the same for prod. The smoke check reads the stage's orchestrator Access
# token from the Alchemy state with the deploy's Cloudflare token, so the
# workflow holds no pecia secret of its own. Pull requests, which only Dependabot opens, run the checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch at a time. A newer pull request run cancels the older one;
# on main a deploy is never cancelled halfway, and a newer push waits for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # oxlint and the lint rules' scenario reserve several GiB of address space
      # (AGENTS.md); let the kernel overcommit, as .agents/resume does in orbs.
      - run: sudo sysctl -w vm.overcommit_memory=1
      - uses: ./.github/actions/setup
      - run: pnpm exec task check

  deploy-staging:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.pecia.joesaia.trade
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec task deploy:staging
      - run: pnpm exec task smoke STAGE=staging

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pecia.joesaia.trade
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec task deploy:prod
      - run: pnpm exec task smoke STAGE=prod
