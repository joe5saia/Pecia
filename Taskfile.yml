# Every developer and CI command lives here; package.json files have no scripts.
# Tools run through `pnpm exec` so their versions come from pnpm-lock.yaml.
version: "3"

set: [errexit, pipefail]

vars:
  STACK_DIR: packages/control-worker
  # Each long-lived stage's own hostname, in the joesaia.trade zone of the
  # saiaai account. The deploy task attaches it to the Worker as a custom
  # domain (PECIA_DOMAIN). Each stage also keeps its workers.dev URL.
  STAGING_DOMAIN: staging.pecia.joesaia.trade
  PROD_DOMAIN: pecia.joesaia.trade
  STAGING_URL: https://{{.STAGING_DOMAIN}}
  # Where access:token writes a stage's orchestrator token, as setup.sh and
  # wiki-session work out pecia's directory.
  PECIA_HOME:
    sh: echo "${PECIA_HOME:-${XDG_CONFIG_HOME:-$HOME/.config}/pecia}"

# Cloudflare credentials for the Alchemy tasks. Alchemy uses them when both are
# set (CI, orbs) and otherwise falls back to the local `alchemy profile`.
# CLOUDFLARE_* wins; the SAIAAI_* names select the saiaai account in orbs.
x-cloudflare-env: &cloudflare-env
  CLOUDFLARE_ACCOUNT_ID: "{{.CLOUDFLARE_ACCOUNT_ID | default .SAIAAI_CLOUDFLARE_ACCOUNT_ID}}"
  CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_API_TOKEN | default .SAIAAI_CLOUDFLARE_API_TOKEN}}"

# The Control Worker's settings. Cloudflare Access gates each stage; the stack
# declares its application and service tokens (docs/operations.md, "Access"),
# so a deploy needs no key of its own. The time limits PECIA_IDLE_TIMEOUT
# (default "2 hours"), PECIA_FORK_SETTLE ("10 minutes"), PECIA_SWEEP_RETRY
# ("5 minutes") and PECIA_SANDBOX_TOKEN_TTL ("1 hour") are optional; deploys
# use the defaults and the scenarios in e2e/ set them to seconds.

# Inputs shared by the checks: Task skips a check when none of them changed.
x-check-sources: &check-sources
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "packages/**/*.sh"
  - "packages/**/*.css"
  - packages/viewer/index.html
  - "e2e/**/*.ts"
  - "e2e/fixtures/**"
  - "*.ts"
  - tsconfig.json
  - .oxlintrc.json
  - .oxfmtrc.json
  - pnpm-lock.yaml

tasks:
  default:
    desc: List tasks
    silent: true
    cmd: task --list

  install:
    desc: Install dependencies from the lockfile
    sources: [pnpm-lock.yaml, pnpm-workspace.yaml, package.json, "packages/*/package.json"]
    generates: [node_modules/.modules.yaml]
    cmd: pnpm install --frozen-lockfile

  fmt:
    desc: Format all files with oxfmt
    cmd: pnpm exec oxfmt

  fmt:check:
    desc: Fail if any file is not formatted
    sources: *check-sources
    cmd: pnpm exec oxfmt --check

  lint:
    desc: Lint with oxlint, including type-aware rules
    sources: *check-sources
    cmd: pnpm exec oxlint --type-aware --deny-warnings

  lint:fix:
    desc: Apply oxlint autofixes
    cmd: pnpm exec oxlint --type-aware --fix

  typecheck:
    desc: Type-check with tsrs and, until tsrs is stable, the official TypeScript compiler
    deps: [typecheck:tsrs, typecheck:tsc]

  # The viewer runs in a browser, so it has its own project with the DOM's types.
  typecheck:tsrs:
    sources: *check-sources
    cmds:
      - pnpm exec tsrs --noEmit
      - pnpm exec tsrs --noEmit -p packages/viewer

  typecheck:tsc:
    sources: *check-sources
    cmds:
      - pnpm exec tsc --noEmit
      - pnpm exec tsc --noEmit -p packages/viewer

  # The scenarios in e2e/ run the built Worker in workerd, the built sandbox
  # tools and the built viewer, so each is built first.
  test:
    desc: Run the E2E scenarios in e2e/ against the built Worker in workerd
    deps: [build:worker, build:tools, build:viewer]
    sources: *check-sources
    cmd: pnpm exec vitest run

  # The only tests are the scenarios in e2e/ (AGENTS.md, "Tests"): this fails
  # on a test file that is not e2e/<name>.test.ts, and on any file of e2e/ that
  # imports from packages/ instead of driving the product from outside. The
  # scenarios may import the API contract, @pecia/wiki-api, which every client
  # of the Worker is derived from, and read built output by its path. It has no
  # sources, so Task never skips it: it takes milliseconds.
  check:tests-in-e2e:
    desc: Fail on a test file that is not a scenario in e2e/, or on e2e/ code that imports the product's code
    cmd: |
      outside=$(git ls-files --cached --others --exclude-standard | grep -E '\.(test|spec)\.[cm]?[jt]sx?$' | grep -vE '^e2e/[^/]+\.test\.ts$' || true)
      imports=$(git grep --untracked -nE "(from|import\(?|require\() *['\"\`][^'\"\`]*(packages/|@pecia/(control-worker|viewer|sandbox-tools|lint-rules))" -- 'e2e/*' ':!e2e/fixtures' || true)
      if [ -n "$outside" ]; then echo "Test files that are not scenarios in e2e/ (unit tests are not allowed):"; echo "$outside"; fi
      if [ -n "$imports" ]; then echo "e2e/ code that imports the product:"; echo "$imports"; fi
      [ -z "$outside" ] && [ -z "$imports" ]

  test:watch:
    desc: Run tests in watch mode
    cmd: pnpm exec vitest

  build:worker:
    desc: Bundle the Control Worker as a deploy does, into packages/control-worker/dist, for the scenarios to run in workerd
    dir: packages/control-worker
    sources: ["src/**/*.ts", "../wiki-api/src/**/*.ts", build.ts, alchemy.run.ts, ../../pnpm-lock.yaml]
    generates: [dist/manifest.json]
    cmd: node build.ts

  build:tools:
    desc: Bundle wiki-credential, wiki-land and wiki-comments into single Node scripts in packages/sandbox-tools/dist
    dir: packages/sandbox-tools
    sources: ["src/**/*.ts", "../wiki-api/src/**/*.ts", rolldown.config.ts, ../../pnpm-lock.yaml]
    generates: [dist/wiki-credential, dist/wiki-land, dist/wiki-comments, dist/package.json]
    cmds:
      - pnpm exec rolldown --config rolldown.config.ts
      - chmod +x dist/wiki-credential dist/wiki-land dist/wiki-comments
      # The scripts are CommonJS with no extension. This keeps Node from reading
      # them as ES modules here, under this package's "type": "module".
      - echo '{"type":"commonjs"}' >dist/package.json

  build:viewer:
    desc: Build the viewer into packages/viewer/dist, which the Control Worker serves
    dir: packages/viewer
    sources: [index.html, vite.config.ts, "src/**/*", "../wiki-api/src/**/*.ts", ../../pnpm-lock.yaml]
    generates: [dist/index.html]
    cmd: pnpm exec vite build

  dev:viewer:
    desc: Serve the viewer with hot reload, calling a deployed Worker's API (PECIA_VIEWER_API, default staging's URL) with staging's orchestrator token
    dir: packages/viewer
    interactive: true
    # The token file `task access:token` writes; without it the API calls answer Access's redirect.
    cmd: PECIA_VIEWER_API="${PECIA_VIEWER_API:-{{.STAGING_URL}}}" PECIA_VIEWER_ACCESS="{{.PECIA_HOME}}/access-staging.env" pnpm exec vite --port "${PORT:-5173}" --strictPort

  check:
    desc: Local CI - every check except deploying
    cmds:
      - task: fmt:check
      - task: lint
      - task: typecheck
      - task: check:tests-in-e2e
      - task: test

  ci:
    desc: Full CI - the local checks, then a preview deploy (needs PULL_REQUEST and Cloudflare credentials)
    cmds:
      - task: check
      - task: deploy:preview

  dev:
    deps: [build:viewer]
    desc: Run the Control Worker and Durable Objects locally with alchemy dev
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    interactive: true
    cmd: pnpm exec alchemy dev

  plan:
    deps: [build:viewer]
    desc: Preview changes to a stage (STAGE, default staging) without deploying
    vars:
      STAGE: '{{.STAGE | default "staging"}}'
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: PECIA_DOMAIN="{{if eq .STAGE "prod"}}{{.PROD_DOMAIN}}{{else if eq .STAGE "staging"}}{{.STAGING_DOMAIN}}{{end}}" pnpm exec alchemy plan --stage {{.STAGE}} --no-input

  # PULL_REQUEST only numbers the preview stage: a Dependabot pull request's
  # number, or any unused number. Other changes have no pull request; they are
  # pushed straight to main (AGENTS.md, "Landing changes").
  deploy:preview:
    deps: [build:viewer]
    desc: Deploy the pr-<PULL_REQUEST> preview stage
    requires:
      vars: [PULL_REQUEST]
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: pnpm exec alchemy deploy --stage pr-{{.PULL_REQUEST}} --yes --no-input

  destroy:preview:
    desc: Destroy the pr-<PULL_REQUEST> preview stage
    requires:
      vars: [PULL_REQUEST]
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: pnpm exec alchemy destroy --stage pr-{{.PULL_REQUEST}} --yes --no-input

  deploy:staging:
    deps: [build:viewer]
    desc: Deploy the staging stage
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: PECIA_DOMAIN={{.STAGING_DOMAIN}} pnpm exec alchemy deploy --stage staging --yes --no-input

  deploy:prod:
    deps: [build:viewer]
    desc: Deploy the prod stage
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: PECIA_DOMAIN={{.PROD_DOMAIN}} pnpm exec alchemy deploy --stage prod --yes --no-input

  # A stage's orchestrator service token, from the Alchemy state (the stack
  # creates it; docs/operations.md, "Access"). It is written to a file only
  # this user can read and never printed. Needs Cloudflare credentials that
  # can read the state, as the deploy tasks do.
  access:token:
    desc: Write a stage's (STAGE, default staging) orchestrator Access token to $PECIA_HOME/access-<stage>.env
    vars:
      STAGE: '{{.STAGE | default "staging"}}'
      FILE: "{{.PECIA_HOME}}/access-{{.STAGE}}.env"
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    silent: true
    cmd: |
      # Task's shell has no umask: the file is made private before anything is written to it.
      mkdir -p -m 700 "$(dirname '{{.FILE}}')"
      rm -f '{{.FILE}}.new' && touch '{{.FILE}}.new' && chmod 600 '{{.FILE}}.new'
      pnpm exec alchemy state read pecia/{{.STAGE}}/OrchestratorToken --no-input --log-level none |
        jq -er '"PECIA_ACCESS_CLIENT_ID=\(.attr.clientId)\nPECIA_ACCESS_CLIENT_SECRET=\(.attr.clientSecret.__redacted__)"' >'{{.FILE}}.new'
      mv '{{.FILE}}.new' '{{.FILE}}'
      echo "wrote {{.STAGE}}'s orchestrator token to {{.FILE}}"

  smoke:
    desc: Check that a deployed stage (STAGE, staging or prod; or a preview with STAGE=pr-<n> URL=<its Worker URL>) answers behind Access with its own orchestrator token
    vars:
      STAGE: '{{.STAGE | default "staging"}}'
      # The stages' Worker URLs, as in .agents/skills/using-pecia-wiki/scripts/wiki-session.
      # A preview's URL is the `url` output `task deploy:preview` prints.
      URL: '{{if .URL}}{{.URL}}{{else if eq .STAGE "prod"}}https://{{.PROD_DOMAIN}}{{else if eq .STAGE "staging"}}https://{{.STAGING_DOMAIN}}{{end}}'
    preconditions:
      - sh: '[ -n "{{.URL}}" ]'
        msg: "STAGE must be staging or prod, or pass the preview's URL"
    # Access must send a caller without a token to the Google sign-in. Listing
    # a workspace that is never created must answer the Durable Object's typed
    # 404 with the stage's orchestrator token: the Worker is published,
    # verifies this stage's Access JWT and reaches its Durable Objects. The
    # viewer's page must be served, which it is only if its assets were
    # uploaded. Retried for a minute, because a newly published Worker can
    # answer `error code: 1104` for a while.
    cmds:
      - task: access:token
        vars: { STAGE: "{{.STAGE}}" }
      - |
        set -a; . "{{.PECIA_HOME}}/access-{{.STAGE}}.env"; set +a
        token=(-H "CF-Access-Client-Id: $PECIA_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $PECIA_ACCESS_CLIENT_SECRET")
        url={{.URL}}/workspaces/ci-smoke/sessions
        for attempt in 1 2 3 4 5 6; do
          anonymous=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$url" || true)
          body=$(curl -sS "${token[@]}" "$url" || true)
          viewer=$(curl -sS "${token[@]}" "{{.URL}}/" || true)
          if [[ "$anonymous" == "302 https://saiaai.cloudflareaccess.com/"* ]] &&
            jq -e '._tag == "NotFound"' >/dev/null 2>&1 <<<"$body" && grep -q '<div id="root">' <<<"$viewer"; then
            echo "{{.STAGE}} answers"
            exit 0
          fi
          echo "attempt $attempt: '${anonymous%% *}' without the token, '$(head -c 200 <<<"$body")' with it, viewer page $(grep -c '<div id="root">' <<<"$viewer") root"
          sleep 10
        done
        exit 1
