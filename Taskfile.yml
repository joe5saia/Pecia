# Every developer and CI command lives here; package.json files have no scripts.
# Tools run through `pnpm exec` so their versions come from pnpm-lock.yaml.
version: "3"

set: [errexit, pipefail]

vars:
  STACK_DIR: packages/control-worker
  # Each long-lived stage's own hostname, in the joesaia.trade zone of the
  # saiaai account. The deploy task attaches it to the Worker as a custom
  # domain (PECIA_DOMAIN). Each stage also keeps its workers.dev URL.
  STAGING_DOMAIN: staging.pecia.joesaia.trade
  PROD_DOMAIN: pecia.joesaia.trade
  STAGING_URL: https://{{.STAGING_DOMAIN}}

# Cloudflare credentials for the Alchemy tasks. Alchemy uses them when both are
# set (CI, orbs) and otherwise falls back to the local `alchemy profile`.
# CLOUDFLARE_* wins; the SAIAAI_* names select the saiaai account in orbs.
x-cloudflare-env: &cloudflare-env
  CLOUDFLARE_ACCOUNT_ID: "{{.CLOUDFLARE_ACCOUNT_ID | default .SAIAAI_CLOUDFLARE_ACCOUNT_ID}}"
  CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_API_TOKEN | default .SAIAAI_CLOUDFLARE_API_TOKEN}}"

# The Control Worker's secrets and settings. Each stage has its own orchestrator
# API key: PECIA_ORCHESTRATOR_KEY_PROD for prod, PECIA_ORCHESTRATOR_KEY_STAGING
# for every other stage (staging, previews, dev). Each Alchemy task passes its
# stage's key to the Worker as PECIA_ORCHESTRATOR_KEY, bound as a secret.
# PECIA_IDLE_TIMEOUT (default "2 hours") is optional.

# Inputs shared by the checks: Task skips a check when none of them changed.
x-check-sources: &check-sources
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "packages/**/*.sh"
  - "*.ts"
  - tsconfig.json
  - .oxlintrc.json
  - .oxfmtrc.json
  - pnpm-lock.yaml

tasks:
  default:
    desc: List tasks
    silent: true
    cmd: task --list

  install:
    desc: Install dependencies from the lockfile
    sources: [pnpm-lock.yaml, pnpm-workspace.yaml, package.json, "packages/*/package.json"]
    generates: [node_modules/.modules.yaml]
    cmd: pnpm install --frozen-lockfile

  fmt:
    desc: Format all files with oxfmt
    cmd: pnpm exec oxfmt

  fmt:check:
    desc: Fail if any file is not formatted
    sources: *check-sources
    cmd: pnpm exec oxfmt --check

  lint:
    desc: Lint with oxlint, including type-aware rules
    sources: *check-sources
    cmd: pnpm exec oxlint --type-aware --deny-warnings

  lint:fix:
    desc: Apply oxlint autofixes
    cmd: pnpm exec oxlint --type-aware --fix

  typecheck:
    desc: Type-check with tsrs and, until tsrs is stable, the official TypeScript compiler
    deps: [typecheck:tsrs, typecheck:tsc]

  # The viewer runs in a browser, so it has its own project with the DOM's types.
  typecheck:tsrs:
    sources: *check-sources
    cmds:
      - pnpm exec tsrs --noEmit
      - pnpm exec tsrs --noEmit -p packages/viewer

  typecheck:tsc:
    sources: *check-sources
    cmds:
      - pnpm exec tsc --noEmit
      - pnpm exec tsc --noEmit -p packages/viewer

  test:
    desc: Run the test suite
    sources: *check-sources
    cmd: pnpm exec vitest run

  test:watch:
    desc: Run tests in watch mode
    cmd: pnpm exec vitest

  build:tools:
    desc: Bundle wiki-credential and wiki-land into single Node scripts in packages/sandbox-tools/dist
    dir: packages/sandbox-tools
    sources: ["src/**/*.ts", "../wiki-api/src/**/*.ts", rolldown.config.ts, ../../pnpm-lock.yaml]
    generates: [dist/wiki-credential, dist/wiki-land, dist/package.json]
    cmds:
      - pnpm exec rolldown --config rolldown.config.ts
      - chmod +x dist/wiki-credential dist/wiki-land
      # The scripts are CommonJS with no extension. This keeps Node from reading
      # them as ES modules here, under this package's "type": "module".
      - echo '{"type":"commonjs"}' >dist/package.json

  build:viewer:
    desc: Build the viewer into packages/viewer/dist, which the Control Worker serves
    dir: packages/viewer
    sources: [index.html, vite.config.ts, "src/**/*", "../wiki-api/src/**/*.ts", ../../pnpm-lock.yaml]
    generates: [dist/index.html]
    cmd: pnpm exec vite build

  dev:viewer:
    desc: Serve the viewer with hot reload, calling a deployed Worker's API (PECIA_VIEWER_API, default staging's URL)
    dir: packages/viewer
    interactive: true
    cmd: PECIA_VIEWER_API="${PECIA_VIEWER_API:-{{.STAGING_URL}}}" pnpm exec vite --port "${PORT:-5173}" --strictPort

  check:
    desc: Local CI - every check except deploying
    cmds:
      - task: fmt:check
      - task: lint
      - task: typecheck
      - task: test

  ci:
    desc: Full CI - the local checks, then a preview deploy (needs PULL_REQUEST, PECIA_ORCHESTRATOR_KEY_STAGING and Cloudflare credentials)
    cmds:
      - task: check
      - task: deploy:preview

  dev:
    deps: [build:viewer]
    desc: Run the Control Worker and Durable Objects locally with alchemy dev
    requires:
      vars: [PECIA_ORCHESTRATOR_KEY_STAGING]
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    interactive: true
    cmd: PECIA_ORCHESTRATOR_KEY="$PECIA_ORCHESTRATOR_KEY_STAGING" pnpm exec alchemy dev

  plan:
    deps: [build:viewer]
    desc: Preview changes to a stage (STAGE, default staging) without deploying
    vars:
      STAGE: '{{.STAGE | default "staging"}}'
      KEY_VAR: '{{if eq .STAGE "prod"}}PECIA_ORCHESTRATOR_KEY_PROD{{else}}PECIA_ORCHESTRATOR_KEY_STAGING{{end}}'
    preconditions:
      - sh: '[ -n "${{.KEY_VAR}}" ]'
        msg: "{{.KEY_VAR}} is not set"
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: PECIA_ORCHESTRATOR_KEY="${{.KEY_VAR}}" PECIA_DOMAIN="{{if eq .STAGE "prod"}}{{.PROD_DOMAIN}}{{else if eq .STAGE "staging"}}{{.STAGING_DOMAIN}}{{end}}" pnpm exec alchemy plan --stage {{.STAGE}} --no-input

  # PULL_REQUEST only numbers the preview stage: a Dependabot pull request's
  # number, or any unused number. Other changes have no pull request; they are
  # pushed straight to main (AGENTS.md, "Landing changes").
  deploy:preview:
    deps: [build:viewer]
    desc: Deploy the pr-<PULL_REQUEST> preview stage
    requires:
      vars: [PULL_REQUEST, PECIA_ORCHESTRATOR_KEY_STAGING]
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: PECIA_ORCHESTRATOR_KEY="$PECIA_ORCHESTRATOR_KEY_STAGING" pnpm exec alchemy deploy --stage pr-{{.PULL_REQUEST}} --yes --no-input

  destroy:preview:
    desc: Destroy the pr-<PULL_REQUEST> preview stage
    requires:
      vars: [PULL_REQUEST]
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: pnpm exec alchemy destroy --stage pr-{{.PULL_REQUEST}} --yes --no-input

  deploy:staging:
    deps: [build:viewer]
    desc: Deploy the staging stage
    requires:
      vars: [PECIA_ORCHESTRATOR_KEY_STAGING]
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: PECIA_ORCHESTRATOR_KEY="$PECIA_ORCHESTRATOR_KEY_STAGING" PECIA_DOMAIN={{.STAGING_DOMAIN}} pnpm exec alchemy deploy --stage staging --yes --no-input

  deploy:prod:
    deps: [build:viewer]
    desc: Deploy the prod stage
    requires:
      vars: [PECIA_ORCHESTRATOR_KEY_PROD]
    dir: "{{.STACK_DIR}}"
    env: *cloudflare-env
    cmd: PECIA_ORCHESTRATOR_KEY="$PECIA_ORCHESTRATOR_KEY_PROD" PECIA_DOMAIN={{.PROD_DOMAIN}} pnpm exec alchemy deploy --stage prod --yes --no-input

  smoke:
    desc: Check that a deployed stage (STAGE, staging or prod; or a preview with STAGE=pr-<n> URL=<its Worker URL>) answers with its own orchestrator key
    vars:
      STAGE: '{{.STAGE | default "staging"}}'
      KEY_VAR: '{{if eq .STAGE "prod"}}PECIA_ORCHESTRATOR_KEY_PROD{{else}}PECIA_ORCHESTRATOR_KEY_STAGING{{end}}'
      # The stages' Worker URLs, as in .agents/skills/using-pecia-wiki/scripts/wiki-session.
      # A preview's URL is the `url` output `task deploy:preview` prints.
      URL: '{{if .URL}}{{.URL}}{{else if eq .STAGE "prod"}}https://{{.PROD_DOMAIN}}{{else if eq .STAGE "staging"}}https://{{.STAGING_DOMAIN}}{{end}}'
    preconditions:
      - sh: '[ -n "{{.URL}}" ]'
        msg: "STAGE must be staging or prod, or pass the preview's URL"
      - sh: '[ -n "${{.KEY_VAR}}" ]'
        msg: "{{.KEY_VAR}} is not set"
    # Listing a workspace that is never created must answer 401 without the key
    # and the Durable Object's typed 404 with it: the Worker is published, has
    # this stage's key and reaches its Durable Objects. The viewer's page must be
    # served, which it is only if its assets were uploaded. Retried for a minute,
    # because a newly published Worker can answer `error code: 1104` for a while.
    cmd: |
      url={{.URL}}/workspaces/ci-smoke/sessions
      for attempt in 1 2 3 4 5 6; do
        anonymous=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
        body=$(curl -sS -H "Authorization: Bearer ${{.KEY_VAR}}" "$url" || true)
        viewer=$(curl -sS "{{.URL}}/" || true)
        if [ "$anonymous" = 401 ] && jq -e '._tag == "NotFound"' >/dev/null 2>&1 <<<"$body" &&
          grep -q '<div id="root">' <<<"$viewer"; then
          echo "{{.STAGE}} answers"
          exit 0
        fi
        echo "attempt $attempt: $anonymous without the key, '$body' with it, viewer page $(grep -c '<div id="root">' <<<"$viewer") root"
        sleep 10
      done
      exit 1
