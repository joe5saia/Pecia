# Development servers for Amp orbs (https://ampcode.com/docs/orbs/portals).
# `amp orb services ensure` starts them and prints their portal URLs.
services:
  # The viewer with hot reload. Its API calls go to staging (PECIA_VIEWER_API
  # in Taskfile.yml), so it shows staging's wikis and needs no local Worker.
  viewer:
    command: pnpm exec task dev:viewer
    health: /
    portal:
      # The proxy sends staging's orchestrator token from the file
      # `task access:token` writes (packages/viewer/vite.config.ts).
      url: /
      title: Viewer (staging)
      description: Shows staging's wikis through staging's orchestrator token. Run `task access:token` first.
